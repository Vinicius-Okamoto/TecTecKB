<script>
  b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

  window.onload = function () {
    obterDados();
    mostrarKpi();
    mostrarkpiresp1();
    mostrarkpiresp2();
    mostrarkpiresp3();
    mostrarkpiresp4();
    mostrarkpiresp5();
    mostrarkpiresp6();
    mostrarkpiresp7();
    mostrarkpiresp8();
  }

  function mostrarKpi() {
    fetch('/Dashboard/kpi')
      .then(function (mostrarkpi) {
        return mostrarkpi.json();
      })
      .then(function (data) {
        const media = Number(data[0].mediaIdade);
        document.getElementById("mediaIdade").innerHTML =
          `Idade média: <b>${media.toFixed(1)}</b>`;
      })
      .catch(function (error) {
        console.error("Erro na hora de carregar kpi:", error);
      });
  }

  function mostrarkpiresp1() {
    fetch('/Dashboard/kpiresp1')
      .then(function (mostrarkpiresp1) {
        return mostrarkpiresp1.json();
      })
      .then(function (data) {
        const resp1 = data[0].resposta1;
        document.getElementById("resp1").innerHTML =
          `Som preferido: <b>${resp1}</b>`;
      })
      .catch(function (error) {
        console.error("Erro na hora de carregar kpiresp1:", error);
      });
  }

  // Função chamada ao carregar a página para obter e processar os dados
  function obterDados() {
    // Aqui seria a função que obteria os dados do banco de dados
    // No caso, aqui você colocaria o fetch que teria o endereço da sua rota que você criou na pasta /routes e chamaria a função plotarGraficoLinha nessa função. Exemplo:

    fetch('/Dashboard/listar')
      .then(function (response) {
        return response.json();
      })
      .then(function (data) {
        plotarGraficoIdade([
          data[0].menor25,
          data[0].de25a40,
          data[0].maior40
        ]);
      })
      .catch(function (error) {
        console.error("Erro no hora de carregar as idades:", error);
      });

  }



  function plotarGraficoIdade(response) {
    var ctx = document.getElementById('graficoIdade');

    console.log(response)

    new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: [
          'Menor de 25 anos',
          'De 25 até 40 anos',
          'Maior que 40 anos'
        ],
        datasets: [{
          label: 'My First Dataset',
          data: response,
          backgroundColor: [
            '#287BBA', '#333480', '#2955A1'
          ],
          hoverOffset: 20
        }]
      },
      options: {
      plugins: {
        legend: {
          labels: {
            color: '#fff',
            font: {
              size: 16}
          }
        }
      }
      }
    });
  }

  // grafico respostas

  const ctx1 = document.getElementById('grafico1');

  new Chart(ctx1, {
    type: 'doughnut',
    data: {
      labels: ['Silencioso', 'Levemente audível', 'Clicky / Barulhento', 'Thock'],
      datasets: [{
        label: '# of Votes',
        data: [12, 19, 3, 5],
        borderWidth: 1,
        backgroundColor: ['#1BF7F7', '#333480', '#2955A1', '#287BBA']
      }]
    },
    options: {  
      plugin: {
        plugins: {
        legend: {
          labels: {
            color: '#fff',
            font: {
              size: 16}
          }
        }
      }
      }
    }
  });

  const ctx2 = document.getElementById('grafico2');

  new Chart(ctx2, {
    type: 'doughnut',
    data: {
      labels: ['Conforto', 'Agilidade', 'Feedback tátil', 'Prazer sonoro', 'Personalização'],
      datasets: [{
        label: '# of Votes',
        data: [12, 19, 3, 5, 3],
        borderWidth: 1,
        backgroundColor: ['#1BF7F7', '#333480', '#2955A1', '#287BBA', '#21A6CE']
      }]
    },
    options: {
      plugins: {
        legend: {
          labels: {
            color: '#fff',
            font: {
              size: 16}
          }
        }
      }
    }
  });

const ctx3 = document.getElementById('grafico3');

  new Chart(ctx3, {
    type: 'doughnut',
    data: {
      labels: ['Lojas físicas no Brasil', 'Lojas online no Brasil', 'Importado da China', 'Importado sem ser da China'],
      datasets: [{
        label: '# of Votes',
        data: [12, 19, 3, 5],
        borderWidth: 1,
        backgroundColor: ['#1BF7F7', '#333480', '#2955A1', '#287BBA']
      }]
    },
    options: {
      plugins: {
        legend: {
          labels: {
            color: '#fff',
            font: {
              size: 16}
          }
        }
      }

  });

    },
    options: {
      plugins: {

          labels: {
            color: '#fff',

          }
