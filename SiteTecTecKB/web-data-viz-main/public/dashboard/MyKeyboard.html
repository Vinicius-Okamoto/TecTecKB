<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário</title>

  <link rel="stylesheet" href="./../css/estiloFormulario.css">
  <link rel="icon" href="./assets/icon/TecTecKB-icone.ico">
  <link rel="preconnect" href="https://fonts.gstatic.com">

  <script src="../js/sessao.js"></script>
  <script src="../js/alerta.js"></script>
</head>

<body onload="validarSessao()" style="background-color: #161618;">

  <div class="janela">
    <div class="header-left">
      <h1>TecTecKB</h1>

      <div class="hello">
        <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
      </div>

      <div class="btn-nav-white">
        <a href="./grafico.html">
          <h3>Gráficos</h3>
        </a>
      </div>

      <div class="btn-nav-white">
        <a href="./Formulario.html">
          <h3>Formulário</h3>
        </a>
      </div>

      <div class="btn-nav">
        <a href="./MyKeyboard.html">
          <h3>MyKeyboard</h3>
        </a>
      </div>

      <div class="btn-logout" onclick="limparSessao()">
        <h3>Sair</h3>
      </div>

    </div>

    <div class="dash">
      <div id="alerta">
      </div>

      <div class="btns-dash" id="btnAquario">
        <div class="container">
          <div class="caixa">
            <div class="formulariotxt">

              <h2>MyKeyboard</h2>
              Teclado: <input type="text" id="teclado"> Preço: <input type="number" id="preco1"> <br><br>
              Switch: <input type="text" id="switch1"> Quantidade: <input type="number" id="qtdswitch"> Preço: <input type="number" id="preco2"> <br><br>
              Keycaps: <input type="text" id="keycaps"> Preço: <input type="number" id="preco3"> <br><br>
              <br><br>
              <button class="botao" onclick="gerartxt()">gerar texto</button>
              <br><br>
              <div id="DivMsg"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>



</body>

<script>
  b_usuario.innerHTML = sessionStorage.NOME_USUARIO;
  function gerartxt() {
    let prec1 = Number(preco1.value)
    let prec2 = Number(preco2.value)
    let prec3 = Number(preco3.value)
    DivMsg.innerHTML = `
    <br>Teclado: ${teclado.value} - Preço: ${prec1 }
    <br>Switch: ${switch1.value} - ${qtdswitch.value}X Preço:  ${(preco2.value * qtdswitch.value)}
    <br>Keycaps: ${keycaps.value} - Preço: ${preco3.value}
    <br>
    <br>Valor Total: ${(prec1 + (prec2 * qtdswitch.value) + prec3)}
    `
  }
  
</script>

</html>
